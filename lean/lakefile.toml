name = "inducedPaths"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["InducedPaths"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "InducedPaths"
